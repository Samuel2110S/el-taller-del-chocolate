    <script>
      var filterSelect = document.getElementById('filter');
var searchInput = document.getElementById('search');

      function filterProducts() {
  var searchInput = document.getElementById('search');
  var filterSelect = document.getElementById('filter');
  
  var searchValue = searchInput.value.trim().toLowerCase();
  var filterValue = filterSelect.value.toLowerCase();
  
  var products = document.querySelectorAll('.product');

  products.forEach(function(img) {
    var psearch = (img.getAttribute('psearch') || '').toLowerCase();
    var pfilt = (img.getAttribute('pfilt') || '').toLowerCase();

    var matchSearch = !searchValue || psearch.includes(searchValue);
    var matchFilter = filterValue === 'ninguno' || pfilt === filterValue;

    var targetElement = img.parentElement.tagName === 'A' ? img.parentElement : img;

    if (matchSearch && matchFilter) {
      targetElement.style.display = "";
    } else {
      targetElement.style.display = "none";
    }
  });
      }

function updateUrlParameters() {
  var searchValue = searchInput.value.trim();
  var filterValue = filterSelect.value.toLowerCase();
  var baseUrl = window.location.origin + window.location.pathname;
  var params = new URLSearchParams(window.location.search);
  
  if (searchValue) {
    params.set('search', searchValue);
  } else {
    params.delete('search');
  }
  
  if (filterValue && filterValue !== 'ninguno') {
    params.set('filter', filterValue);
  } else {
    params.delete('filter');
  }
  
  var newUrl = params.toString() ? baseUrl + '?' + params.toString() : baseUrl;
  history.replaceState(null, '', newUrl);

  filterProducts()
}

searchInput.addEventListener('input', updateUrlParameters);
filterSelect.addEventListener('change', updateUrlParameters);

function matchInput() {
  var params = new URLSearchParams(window.location.search);
  var searchParam = params.get('search');
  var filterParam = params.get('filter');
  
  if (searchParam) {
    searchInput.value = searchParam;
  } else {
    searchInput.value = '';
  }
  
  if (filterParam) {
    var matchingOption = Array.from(filterSelect.options).find(function(option) {
      return option.value.toLowerCase() === filterParam.toLowerCase();
    });
    if (matchingOption) {
      filterSelect.value = matchingOption.value;
    }
  }
 
  updateUrlParameters();
}

window.addEventListener('DOMContentLoaded', matchInput);
    </script>
